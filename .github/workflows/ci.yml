name: quarklytics-ci
on: [push, pull_request]
jobs:
  sample-validation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: quarklytics
          POSTGRES_USER: quarklytics
          POSTGRES_PASSWORD: ci-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U quarklytics -d quarklytics"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt
      - run: python scripts/run_pipeline.py --sample
        env:
          POSTGRES_PASSWORD: ci-password
          DATABASE_URL: postgresql://quarklytics:ci-password@localhost:5432/quarklytics
      - run: pytest -q
        env:
          POSTGRES_PASSWORD: ci-password
          DATABASE_URL: postgresql://quarklytics:ci-password@localhost:5432/quarklytics
