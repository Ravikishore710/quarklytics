services:
  postgres:
    image: postgres:18
    container_name: quarklytics-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quarklytics}
      POSTGRES_USER: ${POSTGRES_USER:-quarklytics}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-quarklytics} -d $${POSTGRES_DB:-quarklytics}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
